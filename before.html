<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Before · webrahul.com today</title>
<link rel="icon" href="logo-mark.svg">
<style>html,body{margin:0;height:100%;background:#f6f8f3}iframe{display:block;width:100%;height:100vh;height:100dvh;border:0}</style>
</head>
<body>
<iframe src="https://webrahul.com/" title="webrahul.com as it is live today"></iframe>
<!-- review only: Before / After switch. "Before" shows webrahul.com as it is live today (before.html frames it),
     "After" is this redesign. Remove this block and before.html before launch. -->
<nav class="ba-sw" aria-label="Compare designs" data-here="before"><a href="before.html" data-ba="before">Before</a><a href="index.html" data-ba="after">After</a></nav>
<style>
.ba-sw{position:fixed;left:16px;bottom:16px;z-index:2147483000;display:flex;gap:2px;padding:4px;border-radius:12px;background:rgba(14,20,18,.82);border:1px solid rgba(255,255,255,.12);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 10px 30px rgba(0,0,0,.3);font:600 13px/1 Inter,system-ui,sans-serif;letter-spacing:-.01em}
.ba-sw a{display:block;padding:9px 14px;border-radius:8px;color:rgba(255,255,255,.7);text-decoration:none;transition:background-color .2s,color .2s}
.ba-sw a:hover{color:#fff}
.ba-sw a[aria-current="page"]{background:#fff;color:#0e1412}
@media (max-width:600px){.ba-sw{left:10px;bottom:10px}.ba-sw a{padding:8px 11px;font-size:12px}}
</style>
<script>(()=>{const sw=document.querySelector(".ba-sw");sw&&sw.querySelector(`[data-ba="${sw.dataset.here}"]`).setAttribute("aria-current","page")})();</script>
</body>
</html>
